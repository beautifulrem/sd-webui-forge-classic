<!doctype html>
<html lang="en" class="dark" data-density="comfortable" data-accent="blue">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <!-- The app has its own dark theme: keep Dark Reader from re-coloring the light one. -->
    <meta name="darkreader-lock" />
    <title>Remi WebUI</title>
    <script>
      // Apply persisted appearance before first paint (see src/lib/theme.ts).
      try {
        // Theme: ?__theme=… in the URL, else the user's pick, else the server's --theme, else dark.
        var p = JSON.parse(localStorage.getItem("remi-appearance") || "{}")
        var s = p.state || {}
        var d = document.documentElement
        var themes = { light: 1, dark: 1, system: 1 }
        var q = new URLSearchParams(location.search).get("__theme")
        var t = themes[q] ? q : themes[s.theme] && s.themeChosen !== false ? s.theme : themes[window.__REMI_THEME__] ? window.__REMI_THEME__ : "dark"
        var dark = t === "light" ? false : t === "system" ? matchMedia("(prefers-color-scheme: dark)").matches : true
        d.classList.toggle("dark", dark)
        if (s.density) d.dataset.density = s.density
        // version 2's default iris became blue (the store's migrate)
        if (s.accent) d.dataset.accent = s.accent === "iris" && (p.version || 0) < 3 ? "blue" : s.accent
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
