[tool.black]
line-length = 1024

[tool.ruff]
target-version = "py311"
line-length = 1024
extend-exclude = ["extensions", "webui/node_modules", "webui/dist", "models", "output", "tmp", "cache"]

[tool.ruff.lint]
# Upstream-origin code keeps Forge's legacy rule set (N805, S307, S102, T, W, F). Remi's own code
# (the strict list in per-file-ignores below) also gets the stricter rules: the negated
# per-file-ignores entry switches them off everywhere else. TID251 (banned imports: Gradio) applies
# to the whole tree. tools/check.sh lints the Remi paths, the test suites, the built-in extensions'
# scripts/ and lib_*/, the upstream-origin runtime (modules/, modules_forge/ without the vendored
# packages/, backend/, scripts/, launch.py, webui.py) with the legacy rules, and the rest of the tree
# (vendored third-party code) for syntax errors and banned imports.
select = ["N805", "S307", "S102", "T", "W", "F", "E", "I", "B", "UP", "SIM", "C4", "RUF", "PIE", "PLE", "TID251"]
ignore = [
    "E501", # long lines are the house style (black at 1024)
    "RUF001", "RUF002", "RUF003", # CJK punctuation in strings and comments is intended
    "RUF012", # pydantic models declare mutable defaults safely
    "SIM105", "SIM108", # try/except/pass and if/else blocks are often clearer
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI parameter markers and frozen dataclasses are fine as defaults
extend-immutable-calls = ["fastapi.Query", "fastapi.Body", "fastapi.Depends", "fastapi.File", "fastapi.Form", "remi.library.GalleryQuery", "remi.prompt_tools.tags.FrequencyConfig"]

[tool.ruff.lint.per-file-ignores]
# Remi's code: remi/, tools/, webui/tools/, tests/(test_)remi_*.py and every file Remi added to the
# upstream-origin tree (extension params / tests, modules/redact.py, ...). Add new files here.
"!{remi/**,tools/**,webui/tools/**,tests/remi_*.py,tests/test_remi_*.py,extensions-builtin/ADetailer-Neo/tests/adetailer_testlib.py,extensions-builtin/ADetailer-Neo/tests/conftest.py,extensions-builtin/ADetailer-Neo/tests/test_adetailer_params.py,extensions-builtin/anima-artist-scheduled-mixer/tests/test_panel_defaults.py,extensions-builtin/anima-artist-scheduled-mixer/tests/test_remi_params.py,extensions-builtin/anima-lora-layer-weight/tests/test_remi_params.py,extensions-builtin/anima-lora-layer-weight/tests/test_widget_fixtures.py,extensions-builtin/anima-lora-stage-scheduler/lib_stage_scheduler/params.py,extensions-builtin/anima-lora-stage-scheduler/tests/test_remi_params.py,extensions-builtin/anima-lora-stage-scheduler/tests/test_widget_fixtures.py,extensions-builtin/extra-options-section/tests/conftest.py,extensions-builtin/extra-options-section/tests/test_extra_options_params.py,extensions-builtin/sd-forge-anima-prompt-rescale/tests/conftest.py,extensions-builtin/sd-forge-anima-prompt-rescale/tests/test_remi_params.py,extensions-builtin/sd-forge-anima-prompt-rescale/tests/test_rescale.py,extensions-builtin/sd-forge-anima-resolutions/tests/conftest.py,extensions-builtin/sd-forge-anima-resolutions/tests/test_resolutions.py,extensions-builtin/sd-forge-dynamic-shift/tests/conftest.py,extensions-builtin/sd-forge-dynamic-shift/tests/test_dynamic_shift_params.py,extensions-builtin/sd-forge-negpip/tests/test_negpip_params.py,extensions-builtin/sd-forge-prompt-blacklist/tests/conftest.py,extensions-builtin/sd-forge-prompt-blacklist/tests/test_prompt_blacklist_params.py,extensions-builtin/sd-forge-prompt-workshop/tests/conftest.py,extensions-builtin/sd-forge-prompt-workshop/tests/test_prompt_workshop_page.py,extensions-builtin/sd-lock-img2img-steps/tests/conftest.py,extensions-builtin/sd-lock-img2img-steps/tests/test_lock_steps_params.py,extensions-builtin/sd-postprocess-suite/tests/conftest.py,extensions-builtin/sd-postprocess-suite/tests/pp_suite_testlib.py,extensions-builtin/sd-postprocess-suite/tests/test_postprocess_suite_params.py,extensions-builtin/sd-webui-detail-daemon/tests/conftest.py,extensions-builtin/sd-webui-detail-daemon/tests/detail_daemon_testlib.py,extensions-builtin/sd-webui-detail-daemon/tests/schedule_cases.py,extensions-builtin/sd-webui-detail-daemon/tests/test_detail_daemon_params.py,extensions-builtin/sd-webui-joycaption-modified/tests/conftest.py,extensions-builtin/sd-webui-joycaption-modified/tests/test_joycaption_page.py,extensions-builtin/sd-webui-language-diffusion/tests/conftest.py,extensions-builtin/sd-webui-language-diffusion/tests/test_language_diffusion.py,extensions-builtin/sd-webui-prompt-all-in-one-neo/scripts/prompt_tools.py,extensions-builtin/sd-webui-prompt-anchor/tests/conftest.py,extensions-builtin/sd-webui-prompt-anchor/tests/test_prompt_anchor_params.py,extensions-builtin/sd-webui-tagcomplete-neo/scripts/tag_autocomplete.py,extensions-builtin/sd_forge_anima_dave/tests/test_params.py,extensions-builtin/sd_forge_anima_freefuse/tests/test_params.py,extensions-builtin/sd_forge_anima_guidance/tests/test_remi_params.py,extensions-builtin/sd_forge_anima_hires_guard/tests/test_remi_params.py,extensions-builtin/sd_forge_anima_regional/tests/test_params.py,extensions-builtin/sd_forge_anima_xattn_boost/tests/test_params.py,extensions-builtin/sd_forge_compile/tests/test_compile_params.py,extensions-builtin/sd_forge_controlnet/lib_controlnet/openpose.py,extensions-builtin/sd_forge_controlnet/lib_controlnet/region_canvas.py,extensions-builtin/sd_forge_controlnet/lib_controlnet/unit_actions.py,extensions-builtin/sd_forge_controlnet/lib_controlnet/unit_param.py,extensions-builtin/sd_forge_controlnet/tests/conftest.py,extensions-builtin/sd_forge_controlnet/tests/test_controlnet_params.py,extensions-builtin/sd_forge_controlnet/tests/test_preprocessor_extensions.py,extensions-builtin/sd_forge_image_stitch/tests/conftest.py,extensions-builtin/sd_forge_image_stitch/tests/test_image_stitch_params.py,extensions-builtin/sd_forge_lora/tests/conftest.py,extensions-builtin/sd_forge_lora/tests/test_lora_script.py,extensions-builtin/sd_forge_lora_schedule/tests/conftest.py,extensions-builtin/sd_forge_lora_schedule/tests/test_lora_schedule_params.py,extensions-builtin/sd_forge_multidiffusion/tests/conftest.py,extensions-builtin/sd_forge_multidiffusion/tests/test_multidiffusion_params.py,extensions-builtin/sd_forge_neveroom/tests/conftest.py,extensions-builtin/sd_forge_neveroom/tests/test_never_oom_params.py,extensions-builtin/sd_forge_pid/tests/test_pid_params.py,extensions-builtin/sd_forge_radial/tests/conftest.py,extensions-builtin/sd_forge_radial/tests/test_radial_params.py,extensions-builtin/sd_forge_sparse/tests/conftest.py,extensions-builtin/sd_forge_sparse/tests/test_sparse_params.py,extensions-builtin/sd_forge_spectrum/tests/test_spectrum_params.py,extensions-builtin/soft-inpainting/tests/conftest.py,extensions-builtin/soft-inpainting/tests/test_soft_inpainting_params.py,modules/extra_networks_pages.py,modules/redact.py,tests/legacy_ui_contract.py,tests/test_dependencies.py,tests/test_extra_networks_pages.py,tests/test_processing_negative_conds.py,tests/test_scripts_ported.py,tests/test_scripts_xyz_grid.py}" = ["E", "I", "B", "UP", "SIM", "C4", "RUF", "PIE", "PLE"]
"{tools/**,webui/tools/**,remi/server/launch.py}" = ["T20"] # command-line scripts and the launch banner print
# The one developer tool that runs in a Gradio environment: it records an upstream script's Gradio
# ui() in the last Gradio-era revision (docs/remi-webui/extension-guide.md §14). Nothing imports it.
"tools/record_legacy_ui.py" = ["T20", "TID251"]
"{tests/**,extensions-builtin/*/tests/**}" = ["S102"] # tests exec isolated module sources
# Upstream-origin runtime code and the extensions report to the console with print (startup, install,
# model loading messages): T20 stays on for remi/ and the strict files, which use logging.
"{modules/**,modules_forge/**,backend/**,scripts/**,launch.py,webui.py,extensions-builtin/*/scripts/**,extensions-builtin/*/lib_*/**}" = ["T20"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The WebUI is Gradio-free (remi/ui params, remi/server REST + WebSocket, webui/ SPA).
"gradio".msg = "Gradio was removed: declare params() with remi.ui and use remi.server routes"
"gradio_client".msg = "Gradio was removed: use the REST API (/api/v2, /sdapi/v1)"
"gradio_rangeslider".msg = "Gradio was removed: use remi.ui.RangeSlider"
# A site-packages "tests" package (ultralytics ships one) shadows the repo's tests/ directory.
"tests".msg = "load tests/ helpers by path (importlib.util.spec_from_file_location), see tests/test_scripts_ported.py"

[tool.ruff.lint.isort]
known-first-party = ["remi", "modules", "modules_forge", "backend"]

[tool.pytest.ini_options]
# Imports resolve from the repo root wherever pytest starts (as modules_forge/initialization.py sets up the bundled packages)
pythonpath = [".", "modules_forge/packages"]
